function analyse(D){const m={};for(const k in D.cells){const[d,c]=k.split("|");D.cells[k].forEach((v,i)=>parts(v).forEach(p=>{const x=tc(p);if(!x)return;(m[d+"|"+i+"|"+x.t]=m[d+"|"+i+"|"+x.t]||[]).push({d,i,c,p,t:x.t})}))}
 const bad=new Set(),list=[];for(const k in m){const a=m[k],comb=new Set(a.map(e=>e.p)).size==1&&new Set(a.map(e=>e.c)).size==a.length;if(a.length>1&&!comb){list.push(a);a.forEach(e=>bad.add(e.d+"|"+e.c+"|"+e.i+"|"+e.p))}}return{m,bad,list}}
function fromSeed(S){const D={days:S.days,classes:S.classes,subjects:{},teachers:[],cells:{},maxDay:7},T={};
 for(const c in S.teachers)T[c]={code:c,name:S.teachers[c],dset:new Set(),A:{}};
 for(const k in S.cells){const[d,c]=k.split("|"),r=S.cells[k];D.cells[k]=r.map(v=>FIX.has(v)?"":v);let i=0;
  while(i<13){const v=r[i];if(!v||FIX.has(v)){i++;continue}let n=1;while(i+n<13&&r[i+n]===v&&free(d,i+n))n++;
   parts(v).forEach(p=>{const x=tc(p);if(!x||!T[x.t])return;const t=T[x.t];t.dset.add(d);D.subjects[x.s]=SUBJ[x.s]||x.s;const a=t.A[c+x.s]=t.A[c+x.s]||{c,s:x.s,n:0,dbl:0};a.n+=n;a.dbl+=n>>1});i+=n}}

function stuMap(D){const ds={},conf={};(D.students||[]).forEach(s=>{const a=s.subjects;(ds[s.class]=ds[s.class]||new Set());a.forEach(x=>ds[s.class].add(x));for(let x=0;x<a.length;x++)for(let y=x+1;y<a.length;y++){const k=s.class+"|"+[a[x],a[y]].sort().join("|");conf[k]=(conf[k]||0)+1}});return{ds,conf}}
const share=(M,c,a,b)=>a==b||!M.ds[c]||!M.ds[c].has(a)||!M.ds[c].has(b)||M.conf[c+"|"+[a,b].sort().join("|")]>0;
function unitsOf(ts){const U=[];ts.forEach(t=>t.assign.forEach(a=>{const n=+a.n||0,db=Math.min(+a.dbl||0,n>>1);for(let k=0;k<db;k++)U.push({t,c:a.c,s:a.s,len:2});for(let k=0;k<n-2*db;k++)U.push({t,c:a.c,s:a.s,len:1})}));return U}
const toArr=D=>{const o={};D.classes.forEach(c=>D.days.forEach(d=>{const r=(D.cells||{})[d+"|"+c]||[];o[d+"|"+c]=Array.from({length:13},(_,i)=>r[i]&&!FIX.has(r[i])?r[i].split("/"):[])}));return o};

function runPlace(D,cells,U,M){const busy=new Set(),td={},used={};
 for(const k in cells){const[d,c]=k.split("|");cells[k].forEach((a,i)=>a.forEach(p=>{const x=tc(p);if(!x)return;busy.add(d+"|"+i+"|"+x.t);td[d+x.t]=(td[d+x.t]||0)+1;used[c+p+d]=(used[c+p+d]||0)+1}))}

function placeTeacher(D,t,iters=80){const M=stuMap(D),base=toArr(D),U=unitsOf([t]);

 return{cells:toStr(best.cells),miss:best.miss,total:U.reduce((a,u)=>a+u.len,0),placed}}
function stuClash(D){const out=[];(D.students||[]).forEach(s=>{let n=0;D.days.forEach(d=>{const r=D.cells[d+"|"+s.class];if(r)r.forEach(v=>{if(parts(v).filter(p=>tc(p)&&s.subjects.includes(tc(p).s)).length>1)n++})});if(n)out.push({s,n})});return out}
function blocks(D,c){const st=(D.students||[]).filter(s=>s.class==c),cnt={},C={};st.forEach(s=>{s.subjects.forEach(x=>cnt[x]=(cnt[x]||0)+1);for(let x=0;x<s.subjects.length;x++)for(let y=x+1;y<s.subjects.length;y++)C[[s.subjects[x],s.subjects[y]].sort().join("|")]=1});
 const deg=x=>Object.keys(cnt).filter(y=>C[[x,y].sort().join("|")]).length,B=[];Object.keys(cnt).sort((a,b)=>deg(b)-deg(a)).forEach(s=>{const g=B.find(g=>g.every(x=>!C[[x,s].sort().join("|")]));g?g.push(s):B.push([s])});return{n:st.length,cnt,B}}

const modal=h=>{$("#db").innerHTML=h;if(!$("#dlg").open)$("#dlg").showModal()},close=()=>$("#dlg").close();
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}if(cloud&&pass){clearTimeout(tm);tm=setTimeout(async()=>{try{const r=await fetch("/api/data",{method:"PUT",headers:{"x-admin":pass},body:JSON.stringify(D)});toast(r.ok?"Saved online":"Online save failed")}catch(e){toast("Offline: saved on this device only")}},500)}render()}
const opts=(a,v)=>a.map(x=>`<option value="${esc(x[0])}"${x[0]==v?" selected":""}>${esc(x[1])}</option>`).join("");
const lbl=i=>SLOTS[i]+"–"+(i<12?SLOTS[i+1]:"4:40");
function tname(c){const t=D.teachers.find(x=>x.code==c);return t?t.name:"teacher "+c}
function chips(d,c,i,v,bad){return parts(v).map(p=>{const x=tc(p),b=bad.has(d+"|"+c+"|"+i+"|"+p);return`<span class="chip${b?" x":""}" style="--h:${x?hue(x.s):0}" title="${esc(x?(D.subjects[x.s]||x.s)+" — "+tname(x.t):p)}">${esc(p)}</span>`}).join("")}
function grid(cols,fn){const A=analyse(D);let h=`<div class="wrap"><table><tr><th></th>${cols.map(c=>"<th>"+c.l+"</th>").join("")}</tr>`;
 for(let i=0;i<13;i++){h+=`<tr><td class="t">${lbl(i)}</td>`;if(i==4||i==8){h+=`<td class="fx" colspan="${cols.length}">${i==4?"BREAK":"LUNCH"}</td></tr>`;continue}
  cols.forEach(c=>{h+="<td>"+(c.d=="MON"&&i==3?'<span class="mut">ASSEMBLY</span>':fn(c,i,A))+"</td>"});h+="</tr>"}return h+"</table></div>"}
function render(){$("#who").textContent=cloud?(ro?"View only":"Administrator"):"Local mode (this device)";
 $("#nav").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${tab==k?"on":""}">${l}</button>`).join("");const M=$("#main");
 const hdr=ro?'<div class="card mut">View only. Log in as administrator under “Data & online” to make changes.</div>':"";
 if(tab=="teachers"){const A=analyse(D);M.innerHTML=hdr+(ro?"":'<p><button class="pri" data-a="tadd">+ Add teacher</button></p>')+`<div class="card wrap"><table><tr><th>Code</th><th>Name</th><th>Days available</th><th>Classes &amp; subjects (periods)</th><th>Total</th><th></th></tr>${D.teachers.map((t,i)=>`<tr><td>${esc(t.code)}</td><td class="l">${esc(t.name)}</td><td>${t.days.join(" ")}</td><td class="l">${t.assign.map(a=>`${esc(a.c)} ${esc(a.s)} ×${a.n}${a.dbl?" ("+a.dbl+"D)":""}`).join(", ")}</td><td>${t.assign.reduce((s,a)=>s+(+a.n||0),0)}</td><td>${ro?"":`<button data-a="rep" data-i="${i}">Re-place</button> <button data-a="tedit" data-i="${i}">Edit</button> <button class="dng" data-a="tdel" data-i="${i}">Delete</button>`}</td></tr>`).join("")||'<tr><td colspan="6" class="mut">No teachers yet. Add one, or load the sample under “Data & online”.</td></tr>'}</table></div>`}
 else if(tab=="setup"){M.innerHTML=hdr+`<div class="card f"><label>Classes (comma separated)<input id="scl" value="${esc(D.classes.join(", "))}"></label><br><label>Subjects (one per line, CODE=Name)<textarea id="ssu" rows="9">${esc(Object.entries(D.subjects).map(([k,v])=>k+"="+v).join("\n"))}</textarea></label><br><label>Maximum periods per teacher per day<input id="smd" type="number" value="${D.maxDay||7}"></label><p class="mut">Classes starting with S5 or S6 are treated as A-level: several subjects can run at the same time (split groups).</p>${ro?"":'<button class="pri" data-a="ssave">Save setup</button>'}</div>`}
 else if(tab=="stu")M.innerHTML=hdr+stuView();
 else if(tab=="gen"){const free5=D.days.slice(0,5).reduce((s,d)=>s+[...Array(13).keys()].filter(i=>free(d,i)).length,0);
  M.innerHTML=hdr+`<div class="card"><b>Before you generate</b><div class="wrap"><table><tr><th>Class</th><th>Periods required</th><th>Slots available (Mon–Fri)</th><th>Status</th></tr>${D.classes.map(c=>{const n=D.teachers.reduce((s,t)=>s+t.assign.filter(a=>a.c==c).reduce((x,a)=>x+(+a.n||0),0),0),sp=isSplit(c),ok=sp||n<=free5;return`<tr><td>${c}</td><td>${n}</td><td>${sp?"parallel groups":free5}</td><td class="${ok?"":"err"}">${ok?"OK":"Too many periods"}</td></tr>`}).join("")}</table></div>${ro?"":'<p><button class="pri" data-a="gen">Generate timetable</button> '+(prev?'<button data-a="undo">Undo last apply</button>':"")+"</p>"}${noData()}<p class="mut">The system places every lesson so that no teacher or class is double-booked, teachers only work on their available days, double periods stay together, and the same subject is spread across the week.</p></div><div id="gres"></div>`;
  if(cand)showCand()}
 else if(tab=="class"){sel.c=sel.c||D.classes[0];M.innerHTML=`<p class="np"><select data-s="c">${opts(D.classes.map(c=>[c,c]),sel.c)}</select> <button onclick="print()">Print</button></p>`+grid(D.days.map(d=>({l:d,d})),(c,i,A)=>chips(c.d,sel.c,i,(D.cells[c.d+"|"+sel.c]||[])[i]||"",A.bad))}
 else if(tab=="tview"){sel.t=sel.t||(D.teachers[0]||{}).code||"";M.innerHTML=`<p class="np"><select data-s="t">${opts(D.teachers.map(t=>[t.code,t.code+" · "+t.name]),sel.t)}</select> <button onclick="print()">Print</button></p><h3>${esc(tname(sel.t))}</h3>`+grid(D.days.map(d=>({l:d,d})),(c,i,A)=>(A.m[c.d+"|"+i+"|"+sel.t]||[]).map(e=>`<span class="cl">${e.c}</span>`+chips(c.d,e.c,i,e.p,A.bad)).join(""))}
 else if(tab=="rep"){const A=analyse(D),n={},dy={};for(const k in A.m){const t=k.split("|")[2];n[t]=(n[t]||0)+1;(dy[t]=dy[t]||new Set()).add(k.split("|")[0])}const mx=Math.max(1,...Object.values(n));
  M.innerHTML=`${stuReport()}<div class="card"><b>Clashes</b>${A.list.length?A.list.map(a=>`<p class="err">${esc(tname(a[0].t))}: ${a[0].d} ${lbl(a[0].i)} — ${a.map(e=>e.c+" "+e.p).join(", ")}</p>`).join(""):'<p>No clashes.</p>'}</div><div class="card wrap"><b>Workload (placed on the timetable)</b><table><tr><th>Code</th><th>Teacher</th><th>Periods</th><th>Days</th><th></th></tr>${D.teachers.map(t=>`<tr><td>${esc(t.code)}</td><td class="l">${esc(t.name)}</td><td>${n[t.code]||0}</td><td>${dy[t.code]?dy[t.code].size:0}</td><td><div class="bar"><i style="width:${(n[t.code]||0)/mx*100}%"></i></div></td></tr>`).join("")}</table></div>`}
 else{M.innerHTML=`<div class="card"><b>Backup</b><p><button data-a="exp">Download data (JSON)</button> <label><input type="file" id="imp" accept=".json" hidden><button data-a="impb">Import data</button></label> <button data-a="csv">Download timetable (CSV)</button></p></div>${ro?"":`<div class="card"><b>Start</b><p><button data-a="sample">Load Kanyabwanga sample (teachers and current timetable)</button> <button class="dng" data-a="reset">Clear everything</button></p></div>`}<div class="card f"><b>Online sharing</b><p class="mut">${cloud?"Connected to the online database. Anyone can view; only the administrator can edit.":"Not connected. After you deploy with the online database (see the setup steps), this page shares one timetable for everyone."}</p>${cloud?`<label>Administrator password<input id="pw" type="password"></label><br><button data-a="login" class="pri">Log in</button>`:""}</div>`}
 document.querySelectorAll("[data-s]").forEach(s=>s.onchange=()=>{sel[s.dataset.s]=s.value;render()})}
function showCand(){const m=cand.miss;$("#gres").innerHTML=`<div class="card"><b>Result</b><p>${cand.total-m.reduce((a,u)=>a+u.len,0)} of ${cand.total} periods placed. ${m.length?`<span class="err">${m.length} lesson(s) could not be placed:</span>`:"Everything fits."}</p>${m.slice(0,15).map(u=>`<div class="err">${esc(u.t.name)} · ${u.c} · ${u.s}${u.len==2?" (double)":""}</div>`).join("")}${m.length?'<p class="mut">Try giving those teachers more available days, fewer periods, or fewer doubles.</p>':""}<button class="pri" data-a="apply">Apply this timetable</button></div>`}
function tform(i){const t=i>=0?D.teachers[i]:{code:"",name:"",days:["MON","TUE","WED","THU","FRI"],assign:[]};
 const row=a=>`<div class="r"><select class="ac">${opts(D.classes.map(c=>[c,c]),a.c)}</select><select class="as">${opts(Object.entries(D.subjects).map(([k,v])=>[k,k+" "+v]),a.s)}</select><input class="an" type="number" min="1" max="30" value="${a.n||4}"> periods <input class="ad" type="number" min="0" max="10" value="${a.dbl||0}"> doubles <button class="dng rm">×</button></div>`;
 window._row=()=>row({c:D.classes[0],s:Object.keys(D.subjects)[0],n:4,dbl:0});
 modal(`<b>${i>=0?"Edit":"Add"} teacher</b><div class="g f"><label>Code (number)<input id="tc" value="${esc(t.code)}"></label><label>Full name<input id="tn" value="${esc(t.name)}"></label></div><div>Days available: ${D.days.map(d=>`<label class="ck"><input type="checkbox" class="dy" value="${d}"${t.days.includes(d)?" checked":""}>${d}</label>`).join("")}</div><p><b>Classes and subjects taught</b></p><div id="rows">${t.assign.map(row).join("")}</div><button id="addr">+ Add class/subject</button><p><label class="ck"><input type="checkbox" id="auto" checked> Timetable this teacher automatically after saving</label></p><p id="er" class="err"></p><button class="pri" id="ok">Save</button> <button id="no">Cancel</button>`);
 $("#addr").onclick=()=>$("#rows").insertAdjacentHTML("beforeend",window._row());$("#no").onclick=close;
 $("#ok").onclick=()=>{const code=$("#tc").value.trim().padStart(2,"0"),name=$("#tn").value.trim();if(!/^\d+$/.test(code)||!name)return $("#er").textContent="Enter a numeric code and a name.";
  if(D.teachers.some((x,j)=>x.code==code&&j!=i))return $("#er").textContent="That code is already used.";const days=[...document.querySelectorAll(".dy:checked")].map(e=>e.value);if(!days.length)return $("#er").textContent="Pick at least one day.";
  const assign=[...document.querySelectorAll("#rows .r")].map(r=>({c:r.querySelector(".ac").value,s:r.querySelector(".as").value,n:+r.querySelector(".an").value||0,dbl:+r.querySelector(".ad").value||0}));
  const tt={code,name,days,assign},old=i>=0?JSON.stringify({d:D.teachers[i].days,a:D.teachers[i].assign}):"",ch=old!=JSON.stringify({d:days,a:assign}),au=$("#auto").checked;if(i>=0)D.teachers[i]=tt;else D.teachers.push(tt);close();save();if(au&&assign.length&&(i<0||ch))autoPlace(code)}}
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.classList.contains("rm")){b.parentElement.remove();return}const a=b.dataset.a,i=+b.dataset.i;if(!a)return;
 if(a=="tadd")tform(-1);else if(a=="tedit")tform(i);else if(a=="tdel"){if(confirm("Delete this teacher?")){const cd=D.teachers[i].code;for(const k in D.cells)D.cells[k]=D.cells[k].map(v=>parts(v).filter(p=>!(tc(p)&&tc(p).t==cd)).join("/"));D.teachers.splice(i,1);save()}}
 else if(a=="ssave"){D.classes=$("#scl").value.split(",").map(s=>s.trim().toUpperCase()).filter(Boolean);D.subjects={};$("#ssu").value.split("\n").forEach(l=>{const[k,...v]=l.split("=");if(k&&k.trim())D.subjects[k.trim().toUpperCase()]=v.join("=").trim()||k.trim()});D.maxDay=+$("#smd").value||7;save();toast("Setup saved")}
 else if(a=="rep")autoPlace(D.teachers[i].code);
 else if(a=="undo2"){D.cells=JSON.parse(prev);prev=null;close();save()}
 else if(a=="regen"){close();tab="gen";cand=generate(D);render()}
 else if(a=="sclear"){if(confirm("Remove all students?")){D.students=[];save()}}
 else if(a=="stmpl")dl("students-template.csv","Name,Class,Subjects\nAINEMBABAZI RUTH,S5S,PHY/CHEM/MTC/ICT\nKATO JOHN,S5A,HIST/GEO/ECON/SUBMTC\n","text/csv")
 else if(a=="simp"){const R=csv($("#spaste").value);if(!R.length)return toast("Paste some rows first");const r=stuImport(R);showImp(r)}
 else if(a=="gen"){b.textContent="Working…";setTimeout(()=>{cand=generate(D);render()},30)}
 else if(a=="apply"){prev=JSON.stringify(D.cells);D.cells=cand.cells;cand=null;save();tab="class";render();toast("Timetable applied")}
 else if(a=="undo"){D.cells=JSON.parse(prev);prev=null;save()}
 else if(a=="exp"){dl("timetable-data.json",JSON.stringify(D,null,1),"application/json")}
 else if(a=="csv"){const L=["Day,Class,"+SLOTS.map((s,i)=>lbl(i)).join(",")];for(const k in D.cells){const[d,c]=k.split("|");L.push(d+","+c+","+D.cells[k].map(v=>'"'+v+'"').join(","))}dl("timetable.csv",L.join("\n"),"text/csv")}
 else if(a=="impb")$("#imp").click();
 else if(a=="sample"){if(!D.teachers.length||confirm("Replace current data with the sample?")){D=fromSeed(SEED);save();tab="teachers";render()}}
 else if(a=="reset"){if(confirm("Delete ALL teachers and timetable data?")){D=blank();save()}}
 else if(a=="login"){const p=$("#pw").value;try{const r=await fetch("/api/data",{method:"POST",headers:{"x-admin":p}});if(r.ok){pass=p;ro=false;sessionStorage.setItem("ttp",p);if(!D.teachers.length&&!SEED)0;render();toast("Logged in")}else toast("Wrong password")}catch(x){toast("Could not reach server")}}});
document.addEventListener("change",e=>{if(e.target.id!="imp")return;const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save();toast("Imported")}catch(x){toast("Invalid file")}};r.readAsText(f)});
function dl(n,t,m){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function autoPlace(code){const t=D.teachers.find(x=>x.code==code);if(!t)return;prev=JSON.stringify(D.cells);const r=placeTeacher(D,t);D.cells=r.cells;save();
 const lines=r.placed.sort((a,b)=>D.days.indexOf(a.d)-D.days.indexOf(b.d)||a.i-b.i).map(e=>`${e.d} ${lbl(e.i)} · ${e.c} · ${esc(e.p)}`);const got=r.total-r.miss.reduce((a,u)=>a+u.len,0);
 modal(`<b>${esc(t.name)} has been timetabled</b><p>${got} of ${r.total} periods placed without moving any other teacher.</p>${r.miss.length?`<p class="err">Could not place: ${r.miss.map(u=>esc(u.c+" "+u.s)).join(", ")}. Add more available days for this teacher, or rebuild the whole timetable.</p>`:""}<div style="max-height:220px;overflow:auto" class="card">${lines.join("<br>")||"Nothing placed."}</div><button class="pri" onclick="close_()">Keep</button> <button data-a="undo2">Undo</button> ${r.miss.length?'<button data-a="regen">Rebuild whole timetable</button>':""}`)}
function close_(){$("#dlg").close()}
const noData=()=>{const c=D.classes.filter(c=>isSplit(c)&&!(D.students||[]).some(s=>s.class==c));return c.length?`<p class="err">No student combinations for ${c.join(", ")}. Add them under “Students (A-level)” so subjects are only run in parallel when no student takes both.</p>`:""};
function stuReport(){const st=D.students||[];if(!st.length)return"";const c=stuClash(D);return`<div class="card"><b>Student clashes</b>${c.length?`<p class="err">${c.length} student(s) have two of their subjects at the same time.</p>`+c.slice(0,15).map(x=>`<div>${esc(x.s.name)} (${esc(x.s.class)}) — ${x.n} overlap(s)</div>`).join(""):"<p>No student has two of their subjects at the same time.</p>"}</div>`}
function stuView(){const st=D.students||[],cls=[...new Set([...D.classes.filter(isSplit),...st.map(s=>s.class)])];
 return(ro?"":`<div class="card f"><b>Upload student combinations</b><p class="mut">One student per row: Name, Class, Subjects (for example PHY/GEO/MTC/ICT). CSV or Excel (.xlsx). Use the subject codes from Setup. Uploading replaces the students of the classes found in the file.</p><input type="file" id="sfile" accept=".csv,.txt,.xlsx,.xls"> <button data-a="stmpl">Download template</button><br><br><label>Or paste rows here<textarea id="spaste" rows="4" placeholder="AINEMBABAZI RUTH, S5S, PHY/CHEM/MTC/ICT"></textarea></label><br><button class="pri" data-a="simp">Import pasted rows</button> <button class="dng" data-a="sclear">Remove all students</button><p id="sres"></p></div>`)
 +cls.map(c=>{const b=blocks(D,c);return`<div class="card"><b>${esc(c)}</b> — ${b.n} students${b.n?"":' <span class="mut">(no data yet: up to 4 subjects run at once, unchecked)</span>'}${b.n?`<p>Subjects taken: ${Object.entries(b.cnt).sort().map(([k,v])=>k+" ("+v+")").join(", ")}</p><p><b>Subjects in the same group can run at the same time</b> (no student takes two of them):</p>`+b.B.map((g,i)=>`<div>Group ${i+1}: ${g.join(", ")}</div>`).join(""):""}</div>`}).join("")}
function csv(t){const R=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==","||ch=="\t"){r.push(c);c=""}else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";if(r.some(x=>x.trim()))R.push(r);r=[]}else c+=ch}r.push(c);if(r.some(x=>x.trim()))R.push(r);return R}
const AL={MATH:"MTC",MATHS:"MTC",MATHEMATICS:"MTC",SUBMATH:"SUBMTC",SUBMATHS:"SUBMTC",GENERALPAPER:"GP",AGRICULTURE:"AGRIC",KISWAHILI:"KISW",ENGLISH:"ENG",LITERATURE:"LIT",HISTORY:"HIST",GEOGRAPHY:"GEO",PHYSICS:"PHY",CHEMISTRY:"CHEM",BIOLOGY:"BIO",ENTREPRENEURSHIP:"ENT",FINEART:"FA",DIVINITY:"DIV",ECONOMICS:"ECON"};
function stuImport(R){const ok=new Set(Object.keys(D.subjects)),unk={},h=R[0].map(x=>x.trim().toUpperCase()),hd=h.some(x=>/^(NAME|STUDENT|CLASS|SUBJECTS?|COMBINATION)$/.test(x));let ni=0,ci=1;
 if(hd){ni=Math.max(0,h.findIndex(x=>/NAME|STUDENT/.test(x)));ci=h.findIndex(x=>/CLASS/.test(x));if(ci<0)ci=ni==1?0:1;R=R.slice(1)}
 const S=[];R.forEach(r=>{const nm=(r[ni]||"").trim(),c=(r[ci]||"").trim().toUpperCase();if(!nm||!c)return;const subs=[...new Set(r.filter((_,j)=>j!=ni&&j!=ci).join(";").toUpperCase().split(/[;\/+&|,\s]+/).map(x=>AL[x]||x).filter(Boolean))];subs.filter(x=>!ok.has(x)).forEach(x=>unk[x]=1);S.push({name:nm,class:c,subjects:subs.filter(x=>ok.has(x))})});
 const cl=new Set(S.map(s=>s.class));cl.forEach(c=>{if(!D.classes.includes(c))D.classes.push(c)});D.students=(D.students||[]).filter(s=>!cl.has(s.class)).concat(S);save();return{n:S.length,cl:[...cl],unk:Object.keys(unk)}}
function showImp(r){const e=$("#sres");if(e)e.innerHTML=`<span>${r.n} students imported for ${r.cl.join(", ")}.</span>`+(r.unk.length?`<br><span class="err">Unknown subject codes ignored: ${r.unk.map(esc).join(", ")}. Add them under Setup, then upload again.</span>`:"")}
document.addEventListener("change",async e=>{if(e.target.id!="sfile")return;const f=e.target.files[0];if(!f)return;try{let R;if(/\.xlsx?$/i.test(f.name)){if(!window.XLSX)await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)});const w=XLSX.read(await f.arrayBuffer(),{type:"array"});R=csv(XLSX.utils.sheet_to_csv(w.Sheets[w.SheetNames[0]]))}else R=csv(await f.text());showImp(stuImport(R))}catch(x){toast("Could not read that file")}});
(async()=>{try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}D=D||blank();
 try{const r=await fetch("/api/data");if(r.ok){const j=await r.json();cloud=true;ro=true;pass=sessionStorage.getItem("ttp")||"";if(pass){const c=await fetch("/api/data",{method:"POST",headers:{"x-admin":pass}});ro=!c.ok;if(ro)pass=""}if(j&&j.teachers)D=j}}catch(e){}
 render()})();
</script></body></html>
